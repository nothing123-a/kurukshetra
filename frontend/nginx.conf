server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy API requests directly to the Flask backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Proxy root-level health endpoint
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy root-level API processing endpoints
    location ~ ^/(clean|report|download_data|encrypt-data) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Route POST /upload to backend, but let GET /upload serve the React SPA
    location = /upload {
        error_page 418 = @backend_upload;
        if ($request_method = POST) {
            return 418;
        }
        if ($request_method = OPTIONS) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @backend_upload {
        proxy_pass http://backend:8000/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Serve static assets built by Vite / React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
